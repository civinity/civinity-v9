services:
  - type: web
    name: civinity-v9-clean
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120 app:app
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DISPATCH_ADMIN_EMAIL
        sync: false
      - key: DISPATCH_ADMIN_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
